name: TBOT

on: push

jobs:
  ci:
    if: "!contains(github.event.head_commit.message, 'Update helm chart version')"
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Run test
        run: make test

      - name: GHCR login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.G_TOKEN }}

      - name: Build and push Docker image
        env:
          APP: "tbot"
          REGISTRY: "ghcr.io/gregorykoshelenko"
        run: |
          make image push

  cd:
    name: CD
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      
      - run: echo "VERSION=$(git describe --tags --abbrev=0)~$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      
      - name: Install yq
        run: |
          sudo wget -O /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.30.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tag in values.yaml
        run: |
          yq -i '.image.tag = strenv(VERSION)' helm/values.yaml
        env:
          VERSION: ${{ env.VERSION }}

      - name: Push changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "Update helm chart version ${{ env.VERSION }}"
          git push origin HEAD:${GITHUB_REF_NAME}
