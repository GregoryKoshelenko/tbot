name: Sync Telegram Secret

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  sync-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Get TELE_TOKEN from GCP Secret Manager
        id: get_secret
        uses: google-github-actions/get-secretmanager-secrets@v1
        with:
          secrets: |
            TELE_TOKEN:projects/${{ secrets.GCP_PROJECT_ID }}/secrets/TELE_TOKEN
      - name: Generate secret.yaml
        run: |
          echo "apiVersion: v1\nkind: Secret\nmetadata:\n  name: telegram-token\n  namespace: default\ntype: Opaque\nstringData:\n  TELE_TOKEN: ${{ steps.get_secret.outputs.TELE_TOKEN }}" > flux/secret.yaml
      - name: Encrypt with SOPS
        run: sops --encrypt flux/secret.yaml > flux/secret.enc.yaml
      - name: Commit encrypted secret
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add flux/secret.enc.yaml
          git commit -m "Update encrypted Telegram secret"
          git push
